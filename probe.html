<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no">
<title>SMF probe</title>
<meta name="theme-color" content="#141110">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SMF probe">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<style>
  html{background:#15110f}
  body{margin:0;background:#0a0807;color:#F6F1EA;
       font:500 15px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}
  /* a frame drawn at the exact edges of the layout viewport */
  #frame{position:fixed;top:0;left:0;right:0;bottom:0;border:3px solid #E8763A;box-sizing:border-box}
  #safe{position:fixed;top:env(safe-area-inset-top,0px);left:env(safe-area-inset-left,0px);
        right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);
        border:2px dashed #4ADE80;box-sizing:border-box;pointer-events:none}
  #out{position:relative;padding:calc(14px + env(safe-area-inset-top,0px)) 16px
        calc(14px + env(safe-area-inset-bottom,0px))}
  h1{font:800 17px/1.3 -apple-system,system-ui,sans-serif;margin:0 0 2px}
  .s{color:#A5978A;font-size:12px;margin:0 0 14px}
  table{border-collapse:collapse;width:100%;font-size:14px}
  td{padding:5px 0;border-bottom:1px solid #2E2620;vertical-align:top}
  td:first-child{color:#A5978A;padding-right:10px;white-space:nowrap}
  td:last-child{color:#F5934E;text-align:right;font-weight:700}
  .k{color:#4ADE80!important}
  .big{font-size:19px}
</style>
</head>
<body>
<div id="frame"></div><div id="safe"></div>
<div id="out">
  <h1>SMF viewport probe</h1>
  <p class="s">orange = layout viewport &middot; green dashes = safe area</p>
  <table id="t"></table>
</div>
<script>
function px(el, prop) {
  var d = document.createElement("div");
  d.style.cssText = "position:fixed;top:-9999px;height:" + prop;
  document.body.appendChild(d);
  var v = getComputedStyle(d).height; d.parentNode.removeChild(d);
  return v;
}
function render() {
  var de = document.documentElement;
  var vv = window.visualViewport || {};
  var mode = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) ? "standalone"
           : (window.navigator.standalone === true ? "ios-standalone" : "browser tab");
  var scr = (window.screen ? screen.width + " x " + screen.height : "?");
  var icb = de.clientWidth + " x " + de.clientHeight;
  var inner = window.innerWidth + " x " + window.innerHeight;
  var sTop = px(document.body, "env(safe-area-inset-top,0px)");
  var sBot = px(document.body, "env(safe-area-inset-bottom,0px)");
  var short = (window.screen ? Math.round(screen.height - de.clientHeight) : 0);
  var rows = [
    ["HOW IT IS RUNNING", mode, true],
    ["screen", scr],
    ["layout viewport (ICB)", icb],
    ["window.inner", inner],
    ["visualViewport", (vv.width ? Math.round(vv.width) + " x " + Math.round(vv.height) : "n/a")],
    ["safe-area top", sTop],
    ["safe-area bottom", sBot],
    ["SCREEN &minus; ICB height", short + "px", true],
    ["devicePixelRatio", window.devicePixelRatio],
    ["orientation", (screen.orientation && screen.orientation.type) || "?"],
    ["userAgent", navigator.userAgent.slice(0, 70)]
  ];
  document.getElementById("t").innerHTML = rows.map(function (r) {
    return "<tr><td>" + r[0] + "</td><td class='" + (r[2] ? "k big" : "") + "'>" + r[1] + "</td></tr>";
  }).join("");
}
render();
addEventListener("resize", render);
addEventListener("orientationchange", function(){ setTimeout(render, 350); });
setTimeout(render, 600); setTimeout(render, 2000);
</script>
</body>
</html>

<!doctype html>

<!-- viewport-fit=cover is REQUIRED. The app's own CSS pads .topline-fixed by
     env(safe-area-inset-top) and .tabbar by env(safe-area-inset-bottom), and
     those env() values are ZERO unless this attribute is present. Without it
     the app cannot see the notch or the gesture bar, the browser letterboxes
     the web view instead, and the app stops reaching the edges of the screen. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no">

<style>
  html,body{margin:0;padding:0;background:#0a0807;color:#F6F1EA;-webkit-text-size-adjust:100%}
  #root{min-height:100dvh}
  /* shown only if the bundle never arrives */
  #boot{position:fixed;inset:0;background:#0a0807;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;
        font:500 13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#A5978A;text-align:center;padding:24px}
  #boot img{width:72px;height:72px;border-radius:18px;opacity:.92}
  #boot .r{width:34px;height:34px;border-radius:50%;border:3px solid #2E2620;border-top-color:#E8763A;animation:s .9s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  #bootbtn{display:none;margin-top:2px;background:#E8763A;border:none;color:#1a0f08;font-weight:700;font-size:13px;
           padding:9px 18px;border-radius:10px;cursor:pointer;font-family:inherit}
  #upd{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;max-width:406px;margin:0 auto;
       display:none;gap:10px;align-items:center;background:#1C1714;border:1px solid #40342B;border-radius:14px;padding:12px 13px;
       box-shadow:0 18px 40px rgba(0,0,0,.6);font:500 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#F6F1EA}
  /* With viewport-fit=cover the page owns the gesture-bar strip and .tabbar's
     own padding-bottom: env(safe-area-inset-bottom) paints it.
     The canvas - what shows if the app shell ever falls short of the screen -
     is the TAB BAR's colour, so any strip reads as part of the tab bar rather
     than a black band. Measured 8 Sep on an installed iPhone app: iOS gave the
     layout viewport 68pt less than the screen and 204px of #0a0807 showed. */
  html{background:#15110f}
  #upd button{margin-left:auto;flex:0 0 auto;background:#E8763A;border:none;color:#1a0f08;font-weight:700;font-size:13px;
              padding:8px 13px;border-radius:10px;cursor:pointer;font-family:inherit}

<body>

<div id="root">
  <div id="boot">
    <img src="icons/icon-192.png" alt="">
    <div class="r"></div>
    <div id="bootmsg">Loading your dashboard…</div>
    <button type="button" id="bootbtn">Try again</button>
  </div>
</div>

<div id="upd"><span>A new version is ready.</span><button type="button" id="updbtn">Reload</button></div>

<script>
/* iOS gives a freshly-installed home-screen app a layout viewport that can be
   shorter than the screen, and does not always correct it until a relayout.
   Measure the real window height and hand it to the shell. Guarded: a silly
   value is ignored, so this can only ever help. */
(function () {
  function fit() {
    try {
      var h = window.innerHeight;
      if (typeof h !== "number" || h < 200 || h > 4000) return;
      document.documentElement.style.setProperty("--appvh", h + "px");
    } catch (e) {}
  }
  fit();
  addEventListener("resize", fit);
  addEventListener("orientationchange", function () { setTimeout(fit, 350); });
  addEventListener("pageshow", fit);
  /* the first launch is when it is wrong; re-check as iOS settles */
  [50, 300, 800, 2000].forEach(function (t) { setTimeout(fit, t); });
})();
</script>

<script>

  /* Never leave someone looking at a spinner with nothing to do.
     8s  - say it is slow, name the likely reason.
     20s - stop spinning and give them a button. */
  setTimeout(function () {
    var m = document.getElementById("bootmsg");
    if (m && !window.__GOT_SB) m.textContent = "Still loading \u2014 this is usually a slow connection.";
  }, 8000);
  setTimeout(function () {
    if (window.__GOT_SB) return;
    var m = document.getElementById("bootmsg"), r = document.querySelector("#boot .r"),
        b = document.getElementById("bootbtn");
    if (r) r.style.display = "none";
    if (m) m.textContent = navigator.onLine
      ? "Couldn't load the app. Tap to try again."
      : "You're offline. Reconnect, then tap to try again.";
    if (b) { b.style.display = "inline-block"; b.onclick = function () { location.reload(); }; }
  }, 20000);
</script>

<!-- ============================================================
     THE ONLY PLACE THE VERSION IS WRITTEN IN THIS FILE.
     Bump ?v= on every release. It is the browser's cache key, and the
     service worker reads it back from here for its own cache name, so
     the two can never disagree.
     ============================================================ -->
<script src="got-app.js?v=1.1.5"></script>

<script>
(function () {
  if (!("serviceWorker" in navigator)) return;
  var reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (reloading) return;
    reloading = true;
    location.reload();
  });
  window.addEventListener("load", function () {
    /* The version lives in exactly one place: the ?v= on the script tag above.
       Read it back out and hand it to the worker, so its cache name always
       matches the bundle this page loaded. */
    var tag = document.querySelector('script[src*="got-app.js"]');
    var m = tag && (tag.getAttribute("src") || "").match(/[?&]v=([^&]+)/);
    var v = m ? m[1] : "0";
    navigator.serviceWorker.register("sw.js?v=" + v).then(function (reg) {
      function offer(worker) {
        if (!worker) return;
        worker.addEventListener("statechange", function () {
          // "installed" with an existing controller means an update is waiting
          if (worker.state === "installed" && navigator.serviceWorker.controller) {
            var bar = document.getElementById("upd");
            bar.style.display = "flex";
            document.getElementById("updbtn").onclick = function () {
              bar.style.display = "none";
              worker.postMessage({ type: "SKIP_WAITING" });
            };
          }
        });
      }
      if (reg.waiting && navigator.serviceWorker.controller) {
        var bar = document.getElementById("upd");
        bar.style.display = "flex";
        document.getElementById("updbtn").onclick = function () {
          bar.style.display = "none";
          reg.waiting.postMessage({ type: "SKIP_WAITING" });
        };
      }
      reg.addEventListener("updatefound", function () { offer(reg.installing); });
    }).catch(function (e) { try { console.debug("sw", e && e.message); } catch (x) {} });
  });
})();
</script>

</body>
